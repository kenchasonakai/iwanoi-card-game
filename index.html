<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1c1e22" />
    <title>岩瀬酒造 蔵元カードゲーム（仮）</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1c1e22; overflow: hidden; }
      #game { position: fixed; inset: 0; }
      #game canvas { display: block; }
      /* 縦に持っているときの案内 */
      #rotate { display: none; position: fixed; inset: 0; align-items: center; justify-content: center;
        color: #e8e2d6; background: #1c1e22; font: 18px/1.6 system-ui, sans-serif; text-align: center; padding: 24px; }
      @media (orientation: portrait) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">端末を横にしてください<br /><small>盤面の全体を一度に見せるため、横画面で遊びます</small></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
